<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Flycast WASM - Dreamcast test</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body, html { height: 100%; margin: 0; background: #111; color: #eee; font-family: sans-serif; }
            #wrap { display: flex; flex-direction: column; align-items: center; padding: 20px; }
            #game { width: 100%; max-width: 1024px; aspect-ratio: 4/3; background: #000; }
            label { display: block; margin: 12px 0 4px; }
            select { font-size: 15px; padding: 6px; }
            #log { margin-top: 12px; width: 100%; max-width: 1024px; height: 200px; overflow: auto; background: #000; border: 1px solid #333; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
            #overlay {
                position: fixed; top: 8px; right: 8px; z-index: 9999;
                background: rgba(0,0,0,0.75); color: #0f0;
                font-family: monospace; font-size: 13px; padding: 6px 10px;
                border: 1px solid #444; border-radius: 4px; pointer-events: none;
                white-space: pre; line-height: 1.4;
            }
            #status { color: #ffa; font-size: 14px; margin: 8px 0; }
            .warn { color: #f88; }
        </style>
    </head>
    <body>
        <div id="overlay">FPS: --<br>Res: --</div>
        <div id="wrap">
            <h2>Flycast WASM (Dreamcast) — local test</h2>
            <label for="rom">Select ROM (auto-detectado):</label>
            <select id="rom" disabled>
                <option>Cargando ROMs...</option>
            </select>
            <div id="status"></div>
            <div id="game"></div>
            <button id="start" disabled>Iniciar</button>
            <div id="log"></div>
        </div>
        <script>
            // The flycast core's glGetString override calls ctx.getParameter(GL_EXTENSIONS)
            // (enum 0x1F03 = 7939), which is INVALID in WebGL and leaves a pending
            // GL_INVALID_ENUM that makes RetroArch's video driver init fail.
            // Patch getParameter so GL_EXTENSIONS returns the supported extensions string.
            const origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(...args) {
                const ctx = origGetContext.apply(this, args);
                if (ctx && (typeof WebGLRenderingContext === "function" && (ctx instanceof WebGLRenderingContext || ctx instanceof WebGL2RenderingContext))) {
                    const origGetParameter = ctx.getParameter.bind(ctx);
                    ctx.getParameter = function(pname) {
                        if (pname === 0x1F03) { // GL_EXTENSIONS
                            const exts = ctx.getSupportedExtensions();
                            if (Array.isArray(exts)) return exts.join(" ");
                            return "";
                        }
                        return origGetParameter(pname);
                    };
                    if (typeof ctx.getSupportedExtensions !== "function") {
                        ctx.getSupportedExtensions = function() { return []; };
                    }
                }
                return ctx;
            };
        </script>
        <script>
            const logEl = document.getElementById("log");
            function log(msg) {
                logEl.textContent += "[" + new Date().toISOString().slice(11,19) + "] " + msg + "\n";
                logEl.scrollTop = logEl.scrollHeight;
            }

            // Base EJS config
            window.EJS_DEBUG_XX = true;
            window.EJS_pathtodata = "data/";
            window.EJS_player = "#game";
            window.EJS_core = "flycast";
            window.EJS_gameName = "Dreamcast";
            window.EJS_biosUrl = "";
            window.EJS_startOnLoaded = true;
            window.EJS_disableDatabases = true;
            window.EJS_threads = false;
            // Don't let EJS auto-create a .cue from the tracks; zips already
            // contain a valid .gdi that flycast should boot directly.
            window.EJS_disableCue = true;

            // BIOS lives in the FS at "/" (system dir resolves to root in this build)
            const BIOS_FILES = {
                "/dc/dc_boot.bin": "bios/dc_boot.bin",
                "/dc/dc_flash.bin": "bios/dc_flash.bin",
                "/dc/dc_nvmem.bin": "bios/dc_nvmem.bin"
            };

            // Build the EJS external-files map for a game: BIOS + (for multi-file
            // cue/gdi games) the track files placed at the FS root, where flycast
            // looks them up relative to the cue/gdi.
            function buildExternalFiles(rom) {
                const files = Object.assign({}, BIOS_FILES);
                if (rom.type === "multi" && Array.isArray(rom.tracks)) {
                    for (const track of rom.tracks) {
                        // The cue/gdi is mounted at "/" so tracks resolve to "/<name>"
                        files["/" + track] = "roms/" + encodeURI(track);
                    }
                }
                return files;
            }

            function formatSize(bytes) {
                if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + " GB";
                if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
                return Math.round(bytes / 1024) + " KB";
            }

            const select = document.getElementById("rom");
            const statusEl = document.getElementById("status");
            const startBtn = document.getElementById("start");

            async function loadRoms() {
                try {
                    const res = await fetch("api/roms");
                    const data = await res.json();
                    const roms = data.roms || [];
                    const bios = data.bios || {};

                    // Cache-bust the core: whenever a new core is compiled, the
                    // server returns a different hash and the browser fetches the
                    // fresh .data instead of serving the cached one.
                    if (data.coreVersion) {
                        window.EJS_paths = {
                            "flycast-wasm.data": "data/cores/flycast-wasm.data?v=" + data.coreVersion,
                            "flycast-legacy-wasm.data": "data/cores/flycast-legacy-wasm.data?v=" + data.coreVersion
                        };
                    }

                    if (!bios.present) {
                        statusEl.innerHTML = '<span class="warn">Falta BIOS: copia a frontend/bios/ los ficheros ' +
                            (bios.needed || ["dc_boot.bin", "dc_flash.bin"]).join(", ") + '.</span>';
                    } else {
                        statusEl.textContent = "BIOS OK";
                    }

                    select.innerHTML = "";
                    if (roms.length === 0) {
                        select.innerHTML = '<option value="">No hay ROMs en frontend/roms/</option>';
                        startBtn.disabled = true;
                        return;
                    }
                    for (const rom of roms) {
                        const opt = document.createElement("option");
                        opt.value = rom.file;
                        opt.textContent = rom.file + "  (" + formatSize(rom.size) + ")";
                        opt.dataset.type = rom.type;
                        select.appendChild(opt);
                    }
                    select.disabled = false;
                    startBtn.disabled = false;
                    log("Detectadas " + roms.length + " ROMs: " + roms.map(r => r.ext).join(", "));
                } catch (e) {
                    statusEl.innerHTML = '<span class="warn">Error cargando ROMs: ' + e.message + '</span>';
                }
            }

            startBtn.addEventListener("click", () => {
                const file = select.value;
                if (!file) return;
                // Find the selected rom in the fetched list
                fetch("api/roms").then(res => res.json()).then(data => {
                    const rom = (data.roms || []).find(r => r.file === file);
                    if (!rom) { log("ROM no encontrada: " + file); return; }

                    window.EJS_externalFiles = buildExternalFiles(rom);
                    window.EJS_gameUrl = rom.url;
                    window.EJS_gameName = rom.file;
                    log("Cargando: " + rom.file + "  [tipo=" + rom.type + ", tracks=" + (rom.tracks || []).length + "]");
                    log("gameUrl: " + rom.url);
                    log("externalFiles: " + Object.keys(window.EJS_externalFiles).length);

                    const script = document.createElement("script");
                    script.src = "data/loader.js";
                    document.body.appendChild(script);
                    startBtn.disabled = true;
                    select.disabled = true;

                    // JIT diagnostic poller
                    let diagCount = 0;
                    const poller = setInterval(() => {
                        if (!window.EJS_emulator || !window.EJS_emulator.Module) { diagCount++; return; }
                        const M = window.EJS_emulator.Module;
                        const prof = M._prof || {};
                        const cacheSize = M._wasmBlockCache ? Object.keys(M._wasmBlockCache).length : -1;
                        const trapCount = M._wasmTrapCount || 0;
                        const jitReady = M._jitImportsResolved ? true : false;
                        log("[JIT] blocks=" + cacheSize + " exec=" + (prof.execCount||0) +
                            " execMs=" + (prof.execMs ? Math.round(prof.execMs) : 0) +
                            " traps=" + trapCount + " jitReady=" + jitReady);
                        diagCount++;
                        if (diagCount > 30) clearInterval(poller);
                    }, 2000);

                    // FPS + resolution overlay
                    let lastFrame = 0, lastTime = performance.now();
                    const overlay = document.getElementById("overlay");
                    const fpsPoller = setInterval(() => {
                        const emu = window.EJS_emulator;
                        if (!emu) { overlay.textContent = "FPS: --\nRes: --\n(esperando core...)"; return; }
                        const gm = emu.gameManager;
                        if (!gm) { overlay.textContent = "FPS: --\nRes: --\n(cargando...)"; return; }
                        let fps = 0;
                        try {
                            const f = gm.getFrameNum();
                            const now = performance.now();
                            if (lastFrame > 0 && now > lastTime) {
                                fps = (f - lastFrame) * 1000 / (now - lastTime);
                            }
                            lastFrame = f; lastTime = now;
                            let w = gm.getVideoDimensions("width");
                            let h = gm.getVideoDimensions("height");
                            if (w > 0 && h > 0) {
                                overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: " + w + "x" + h;
                            } else {
                                overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: n/a";
                            }
                        } catch(e) {
                            overlay.textContent = "FPS: --\nRes: --\nerr: " + e.message;
                        }
                    }, 1000);
                });
            });

            loadRoms();
        </script>
    </body>
</html>
