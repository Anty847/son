 <script>
 // Debug logging system
 const debugPanel = document.getElementById("debugPanel");
 const debugToggle = document.getElementById("debugToggle");
 let debugLogs = [];

 function debugLog(msg, type = "info") {
 const timestamp = new Date().toISOString().slice(11,19);
 const prefix = type === "error" ? "❌" : type === "warn" ? "⚠️" : "ℹ️";
 const logEntry = `[${timestamp}] ${prefix} ${msg}`;
 debugLogs.push(logEntry);
 if (debugLogs.length > 50) debugLogs.shift();
 updateDebugPanel();
 console.log(msg);
 }

 function updateDebugPanel() {
 debugPanel.textContent = debugLogs.join("\n");
 debugPanel.scrollTop = debugPanel.scrollHeight;
 }

 debugToggle.addEventListener("click", () => {
 debugPanel.classList.toggle("hidden");
 debugToggle.textContent = debugPanel.classList.contains("hidden") ? "📊 Debug Panel" : "📊 Hide Debug";
 });

 // Override console.log to also show in debug panel
 const origLog = console.log;
 console.log = function(...args) {
 origLog.apply(console, args);
 debugLog(args.join(" "));
 };

 const origError = console.error;
 console.error = function(...args) {
 origError.apply(console, args);
 debugLog(args.join(" "), "error");
 };

 const origWarn = console.warn;
 console.warn = function(...args) {
 origWarn.apply(console, args);
 debugLog(args.join(" "), "warn");
 };
 </script>

 <script>
 // Patch HTMLCanvasElement.getContext to handle GL_EXTENSIONS (0x1F03)
 const origGetContext = HTMLCanvasElement.prototype.getContext;
 HTMLCanvasElement.prototype.getContext = function(...args) {
 const ctx = origGetContext.apply(this, args);
 if (ctx && (typeof WebGLRenderingContext === "function" && (ctx instanceof WebGLRenderingContext || ctx instanceof WebGL2RenderingContext))) {
 const origGetParameter = ctx.getParameter.bind(ctx);
 ctx.getParameter = function(pname) {
 if (pname === 0x1F03) { // GL_EXTENSIONS
 const exts = ctx.getSupportedExtensions();
 if (Array.isArray(exts)) return exts.join(" ");
 return "";
 }
 return origGetParameter(pname);
 };
 if (typeof ctx.getSupportedExtensions !== "function") {
 ctx.getSupportedExtensions = function() {
 return [];
 };
 }
 }
 return ctx;
 };
 </script>

 <script>
 // File merging utilities for multi-part ROMs
 function mergeFiles(fileParts, cb) {
 return new Promise((resolve, reject) => {
 let buffers = [];
 function fetchPart(index) {
 if (index >= fileParts.length) {
 let mergedBlob = new Blob(buffers);
 let mergedFileUrl = URL.createObjectURL(mergedBlob);
 resolve(mergedFileUrl);
 return;
 }
 fetch(fileParts[index])
 .then((response) => response.arrayBuffer())
 .then((data) => {
 buffers.push(data);
 fetchPart(index + 1);
 })
 .catch(reject);
 cb(index);
 }
 fetchPart(0);
 });
 }

 function getParts(file, start, end) {
 let parts = [];
 for (let i = start; i <= end; i++) {
 let padded = String(i).padStart((end+"").length, '0');
 parts.push(file + ".part" + padded);
 }
 return parts;
 }
 </script>

 <script>
 const logEl = document.getElementById("log");
 function log(msg) {
 logEl.textContent += "[" + new Date().toISOString().slice(11,19) + "] " + msg + "\n";
 logEl.scrollTop = logEl.scrollHeight;
 }

 // Check for direct game URL from gameconfig or URL parameter
 const urlParams = new URLSearchParams(window.location.search);
 const paramUrl = urlParams.get('gameUrl');
 const paramName = urlParams.get('gameName') || 'Dreamcast Game';
 const useDirectUrl = paramUrl || (window.gameconfig && window.gameconfig.url);
 const directGameUrl = paramUrl || (window.gameconfig && window.gameconfig.url);
 const directGameName = paramName || (window.gameconfig && window.gameconfig.name) || "Dreamcast Game";
 const directGameType = (window.gameconfig && window.gameconfig.type) || "single";
 const directGameTracks = (window.gameconfig && window.gameconfig.tracks) || [];

 // Base EJS configuration
 window.EJS_DEBUG_XX = true;
 window.EJS_pathtodata = "data/";
 window.EJS_player = "#game";
 window.EJS_core = (window.gameconfig && window.gameconfig.core) || "flycast";
 window.EJS_gameName = directGameName;
 window.EJS_biosUrl = "";
 window.EJS_startOnLoaded = useDirectUrl ? true : false;
 window.EJS_disableDatabases = true;
 window.EJS_threads = false;
 window.EJS_disableCue = true;

 // MvC2 optimized Flycast settings for Dell Chromebook 3100
 window.EJS_defaultOptions = {
 reicast_frameskip: "0",
 reicast_hd_resolution_scale: "1",
 reicast_render_type: "OpenGL",
 reicast_widescreen_hack: "disabled",
 reicast_sync_ghosts: "disabled"
 };

 // BIOS file mapping
 const BIOS_FILES = {
 "/dc/dc_boot.bin": "bios/dc_boot.bin",
 "/dc/dc_flash.bin": "bios/dc_flash.bin",
 "/dc/dc_nvmem.bin": "bios/dc_nvmem.bin"
 };

 function buildExternalFiles(rom) {
 const files = Object.assign({}, BIOS_FILES);
 const romType = rom.type || directGameType;
 const romTracks = rom.tracks || directGameTracks;
 const romsDir = rom.romsDir || "roms/";
 
 if (romType === "multi" && Array.isArray(romTracks)) {
 for (const track of romTracks) {
 files["/" + track] = romsDir + encodeURI(track);
 }
 }
 return files;
 }

 function formatSize(bytes) {
 if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + " GB";
 if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
 return Math.round(bytes / 1024) + " KB";
 }

 function startEJS(gameUrl, gameName, coreOptions) {
 window.EJS_gameUrl = gameUrl;
 window.EJS_externalFiles = buildExternalFiles({ type: "single", tracks: [] });
 window.EJS_gameName = gameName;
 
 // Apply core options (backend or default)
 if (coreOptions) {
 window.EJS_defaultOptions = coreOptions;
 } else {
 window.EJS_defaultOptions = {
 reicast_frameskip: "0",
 reicast_hd_resolution_scale: "1",
 reicast_render_type: "OpenGL",
 reicast_widescreen_hack: "disabled",
 reicast_sync_ghosts: "disabled"
 };
 }
 
 document.getElementById("romSelector").classList.add("hidden");
 log("Starting: " + gameName);
 debugLog("=== STARTING EMULATOR ===");
 debugLog("Game: " + gameName);
 debugLog("URL: " + gameUrl);
 debugLog("Core Options: " + JSON.stringify(window.EJS_defaultOptions, null, 2));
 
 const script = document.createElement("script");
 script.onerror = () => {
 debugLog("ERROR loading loader.js!", "error");
 };
 script.onload = () => {
 debugLog("loader.js loaded successfully");
 // Delay to let emulator initialize
 setTimeout(() => {
 if (window.EJS_emulator && window.EJS_emulator.Module) {
 const M = window.EJS_emulator.Module;
 debugLog("=== FLYCAST CORE INFO ===");
 debugLog("Module initialized: yes");
 debugLog("WASM memory: " + (M.memory ? "allocated" : "not found"));
 debugLog("Available exports: " + (M.asm ? Object.keys(M.asm.env).slice(0, 10).join(", ") + "..." : "none"));
 } else {
 debugLog("Emulator module not yet ready", "warn");
 }
 }, 2000);
 };
 script.src = "data/loader.js";
 document.body.appendChild(script);
 
 // JIT diagnostic poller
 let diagCount = 0;
 const poller = setInterval(() => {
 if (!window.EJS_emulator || !window.EJS_emulator.Module) { diagCount++; return; }
 const M = window.EJS_emulator.Module;
 const prof = M._prof || {};
 const cacheSize = M._wasmBlockCache ? Object.keys(M._wasmBlockCache).length : -1;
 const trapCount = M._wasmTrapCount || 0;
 const jitReady = M._jitImportsResolved ? true : false;
 log("[JIT] blocks=" + cacheSize + " exec=" + (prof.execCount||0) + " execMs=" + (prof.execMs ? Math.round(prof.execMs) : 0) + " traps=" + trapCount + " jitReady=" + jitReady);
 
 if (diagCount === 3) {
 debugLog("=== JIT COMPILATION STATUS ===");
 debugLog("Compiled blocks: " + cacheSize);
 debugLog("Executed blocks: " + (prof.execCount || 0));
 debugLog("JIT Ready: " + jitReady);
 if (cacheSize > 1000 && prof.execCount < 100) {
 debugLog("⚠️ WARNING: Many blocks compiled but few executed!", "warn");
 debugLog("This suggests fastmem or imports are failing", "warn");
 }
 }
 
 diagCount++;
 if (diagCount > 30) clearInterval(poller);
 }, 2000);
 
 // FPS + resolution overlay
 let lastFrame = 0, lastTime = performance.now();
 const overlay = document.getElementById("overlay");
 const fpsPoller = setInterval(() => {
 const emu = window.EJS_emulator;
 if (!emu) { overlay.textContent = "FPS: --\nRes: --\n(waiting for core...)"; return; }
 const gm = emu.gameManager;
 if (!gm) { overlay.textContent = "FPS: --\nRes: --\n(loading...)"; return; }
 let fps = 0;
 try {
 const f = gm.getFrameNum();
 const now = performance.now();
 if (lastFrame > 0 && now > lastTime) {
 fps = (f - lastFrame) * 1000 / (now - lastTime);
 }
 lastFrame = f;
 lastTime = now;
 let w = gm.getVideoDimensions("width");
 let h = gm.getVideoDimensions("height");
 if (w > 0 && h > 0) {
 overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: " + w + "x" + h;
 } else {
 overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: n/a";
 }
 } catch(e) {
