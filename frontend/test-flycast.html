<!DOCTYPE html>
<html>
 <head>
 <meta charset="UTF-8">
 <title>Flycast WASM - Dreamcast test</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <style>
 body, html { height: 100%; margin: 0; background: #111; color: #eee; font-family: sans-serif; }
 #wrap { display: flex; flex-direction: column; align-items: center; padding: 20px; }
 #game { width: 100%; max-width: 1024px; aspect-ratio: 4/3; background: #000; }
 label { display: block; margin: 12px 0 4px; }
 select, input[type="file"] { font-size: 15px; padding: 6px; }
 #log { margin-top: 12px; width: 100%; max-width: 1024px; height: 200px; overflow: auto; background: #000; border: 1px solid #333; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
 #overlay { position: fixed; top: 8px; right: 8px; z-index: 9999; background: rgba(0,0,0,0.75); color: #0f0; font-family: monospace; font-size: 13px; padding: 6px 10px; border: 1px solid #444; border-radius: 4px; pointer-events: none; white-space: pre; line-height: 1.4; }
 #status { color: #ffa; font-size: 14px; margin: 8px 0; }
 .warn { color: #f88; }
 #romSelector { display: block; }
 #romSelector.hidden { display: none; }
 </style>
 </head>
 <body>
 <div id="overlay">FPS: --<br>Res: --</div>
 <div id="wrap">
 <h2>Flycast WASM (Dreamcast) — local test</h2>
 <div id="romSelector">
 <h3>Upload a ROM</h3>
 <label for="fileUpload">Select ROM file:</label>
 <input type="file" id="fileUpload" accept=".iso,.bin,.gdi,.cdi,.chd">
 <div id="status"></div>
 <button id="uploadStart" disabled>Load Game</button>

 <hr style="margin: 24px 0; border: none; border-top: 1px solid #444;">

 <h3>Or Select from API</h3>
 <label for="rom">Select ROM (auto-detected):</label>
 <select id="rom" disabled>
 <option>Loading ROMs...</option>
 </select>
 <button id="start" disabled>Start</button>
 </div>
 <div id="game"></div>
 <div id="log"></div>
 </div>

 <script>
 // Patch HTMLCanvasElement.getContext to handle GL_EXTENSIONS (0x1F03)
 const origGetContext = HTMLCanvasElement.prototype.getContext;
 HTMLCanvasElement.prototype.getContext = function(...args) {
 const ctx = origGetContext.apply(this, args);
 if (ctx && (typeof WebGLRenderingContext === "function" && (ctx instanceof WebGLRenderingContext || ctx instanceof WebGL2RenderingContext))) {
 const origGetParameter = ctx.getParameter.bind(ctx);
 ctx.getParameter = function(pname) {
 if (pname === 0x1F03) { // GL_EXTENSIONS
 const exts = ctx.getSupportedExtensions();
 if (Array.isArray(exts)) return exts.join(" ");
 return "";
 }
 return origGetParameter(pname);
 };
 if (typeof ctx.getSupportedExtensions !== "function") {
 ctx.getSupportedExtensions = function() {
 return [];
 };
 }
 }
 return ctx;
 };
 </script>

 <script>
 // File merging utilities for multi-part ROMs
 function mergeFiles(fileParts, cb) {
 return new Promise((resolve, reject) => {
 let buffers = [];
 function fetchPart(index) {
 if (index >= fileParts.length) {
 let mergedBlob = new Blob(buffers);
 let mergedFileUrl = URL.createObjectURL(mergedBlob);
 resolve(mergedFileUrl);
 return;
 }
 fetch(fileParts[index])
 .then((response) => response.arrayBuffer())
 .then((data) => {
 buffers.push(data);
 fetchPart(index + 1);
 })
 .catch(reject);
 cb(index);
 }
 fetchPart(0);
 });
 }

 function getParts(file, start, end) {
 let parts = [];
 for (let i = start; i <= end; i++) {
 let padded = String(i).padStart((end+"").length, '0');
 parts.push(file + ".part" + padded);
 }
 return parts;
 }
 </script>

 <script>
 const logEl = document.getElementById("log");
 function log(msg) {
 logEl.textContent += "[" + new Date().toISOString().slice(11,19) + "] " + msg + "\n";
 logEl.scrollTop = logEl.scrollHeight;
 }

 // Check for direct game URL from gameconfig or URL parameter
 const urlParams = new URLSearchParams(window.location.search);
 const paramUrl = urlParams.get('gameUrl');
 const paramName = urlParams.get('gameName') || 'Dreamcast Game';
 const useDirectUrl = paramUrl || (window.gameconfig && window.gameconfig.url);
 const directGameUrl = paramUrl || (window.gameconfig && window.gameconfig.url);
 const directGameName = paramName || (window.gameconfig && window.gameconfig.name) || "Dreamcast Game";
 const directGameType = (window.gameconfig && window.gameconfig.type) || "single";
 const directGameTracks = (window.gameconfig && window.gameconfig.tracks) || [];

 // Base EJS configuration
 window.EJS_DEBUG_XX = true;
 window.EJS_pathtodata = "data/";
 window.EJS_player = "#game";
 window.EJS_core = (window.gameconfig && window.gameconfig.core) || "flycast";
 window.EJS_gameName = directGameName;
 window.EJS_biosUrl = "";
 window.EJS_startOnLoaded = useDirectUrl ? true : false;
 window.EJS_disableDatabases = true;
 window.EJS_threads = false;
 window.EJS_disableCue = true;

 // BIOS file mapping
 const BIOS_FILES = {
 "/dc/dc_boot.bin": "bios/dc_boot.bin",
 "/dc/dc_flash.bin": "bios/dc_flash.bin",
 "/dc/dc_nvmem.bin": "bios/dc_nvmem.bin"
 };

 function buildExternalFiles(rom) {
 const files = Object.assign({}, BIOS_FILES);
 const romType = rom.type || directGameType;
 const romTracks = rom.tracks || directGameTracks;
 const romsDir = rom.romsDir || "roms/";
 
 if (romType === "multi" && Array.isArray(romTracks)) {
 for (const track of romTracks) {
 files["/" + track] = romsDir + encodeURI(track);
 }
 }
 return files;
 }

 function formatSize(bytes) {
 if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + " GB";
 if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
 return Math.round(bytes / 1024) + " KB";
 }

 function startEJS(gameUrl, gameName) {
 window.EJS_gameUrl = gameUrl;
 window.EJS_externalFiles = buildExternalFiles({ type: "single", tracks: [] });
 window.EJS_gameName = gameName;
 
 document.getElementById("romSelector").classList.add("hidden");
 log("Starting: " + gameName);
 
 const script = document.createElement("script");
 script.src = "data/loader.js";
 document.body.appendChild(script);
 
 // JIT diagnostic poller
 let diagCount = 0;
 const poller = setInterval(() => {
 if (!window.EJS_emulator || !window.EJS_emulator.Module) { diagCount++; return; }
 const M = window.EJS_emulator.Module;
 const prof = M._prof || {};
 const cacheSize = M._wasmBlockCache ? Object.keys(M._wasmBlockCache).length : -1;
 const trapCount = M._wasmTrapCount || 0;
 const jitReady = M._jitImportsResolved ? true : false;
 log("[JIT] blocks=" + cacheSize + " exec=" + (prof.execCount||0) + " execMs=" + (prof.execMs ? Math.round(prof.execMs) : 0) + " traps=" + trapCount + " jitReady=" + jitReady);
 diagCount++;
 if (diagCount > 30) clearInterval(poller);
 }, 2000);
 
 // FPS + resolution overlay
 let lastFrame = 0, lastTime = performance.now();
 const overlay = document.getElementById("overlay");
 const fpsPoller = setInterval(() => {
 const emu = window.EJS_emulator;
 if (!emu) { overlay.textContent = "FPS: --\nRes: --\n(waiting for core...)"; return; }
 const gm = emu.gameManager;
 if (!gm) { overlay.textContent = "FPS: --\nRes: --\n(loading...)"; return; }
 let fps = 0;
 try {
 const f = gm.getFrameNum();
 const now = performance.now();
 if (lastFrame > 0 && now > lastTime) {
 fps = (f - lastFrame) * 1000 / (now - lastTime);
 }
 lastFrame = f;
 lastTime = now;
 let w = gm.getVideoDimensions("width");
 let h = gm.getVideoDimensions("height");
 if (w > 0 && h > 0) {
 overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: " + w + "x" + h;
 } else {
 overlay.textContent = "FPS: " + fps.toFixed(1) + "\nRes: n/a";
 }
 } catch(e) {
 overlay.textContent = "FPS: --\nRes: --\nerr: " + e.message;
 }
 }, 1000);
 }

 // ============ DIRECT URL MODE ============
 if (useDirectUrl) {
 document.getElementById("romSelector").classList.add("hidden");
 startEJS(directGameUrl, directGameName);
 } else {
 // ============ FILE UPLOAD ============
 const fileInput = document.getElementById("fileUpload");
 const uploadBtn = document.getElementById("uploadStart");
 const statusEl = document.getElementById("status");

 fileInput.addEventListener("change", (e) => {
 const file = e.target.files[0];
 if (!file) { uploadBtn.disabled = true; return; }
 statusEl.textContent = "File selected: " + file.name + " (" + formatSize(file.size) + ")";
 uploadBtn.disabled = false;
 });

 uploadBtn.addEventListener("click", () => {
 const file = fileInput.files[0];
 if (!file) return;
 uploadBtn.disabled = true;
 fileInput.disabled = true;
 statusEl.textContent = "Loading...";
 
 const gameUrl = URL.createObjectURL(file);
 startEJS(gameUrl, file.name);
 });

 // ============ API ROM PICKER MODE ============
 async function loadRoms() {
 try {
 const res = await fetch("api/roms");
 const data = await res.json();
 const roms = data.roms || [];
 const bios = data.bios || {};

 if (data.coreVersion) {
 window.EJS_paths = {
 "flycast-wasm.data": "data/cores/flycast-wasm.data?v=" + data.coreVersion,
 "flycast-legacy-wasm.data": "data/cores/flycast-legacy-wasm.data?v=" + data.coreVersion
 };
 }

 if (!bios.present) {
 statusEl.innerHTML = '<span class="warn">Missing BIOS: copy ' +
 (bios.needed || ["dc_boot.bin", "dc_flash.bin"]).join(", ") + ' to frontend/bios/</span>';
 }

 const select = document.getElementById("rom");
 const startBtn = document.getElementById("start");

 select.innerHTML = "";
 if (roms.length === 0) {
 select.innerHTML = '<option value="">No ROMs in frontend/roms/</option>';
 startBtn.disabled = true;
 return;
 }

 for (const rom of roms) {
 const opt = document.createElement("option");
 opt.value = rom.file;
 opt.textContent = rom.file + " (" + formatSize(rom.size) + ")";
 opt.dataset.type = rom.type;
 opt.dataset.partCount = rom.partCount || "0";
 select.appendChild(opt);
 }

 select.disabled = false;
 startBtn.disabled = false;
 log("Detected " + roms.length + " ROMs");
 } catch (e) {
 statusEl.innerHTML = '<span class="warn">Error loading ROMs: ' + e.message + '</span>';
 }
 }

 const select = document.getElementById("rom");
 const startBtn = document.getElementById("start");

 startBtn.addEventListener("click", async () => {
 const file = select.value;
 if (!file) return;

 startBtn.disabled = true;
 select.disabled = true;

 try {
 const res = await fetch("api/roms");
 const data = await res.json();
 const rom = (data.roms || []).find(r => r.file === file);
 if (!rom) { log("ROM not found: " + file); startBtn.disabled = false; select.disabled = false; return; }

 let gameUrl = rom.url;

 // Handle multi-part ROMs
 if (rom.partCount && rom.partCount > 1) {
 log("ROM split into " + rom.partCount + " parts, merging...");
 try {
 gameUrl = await mergeFiles(
 getParts(rom.url, 1, rom.partCount),
 (index) => {
 log("Fetched part " + (index + 1) + "/" + rom.partCount);
 }
 );
 log("Merged into blob URL: " + gameUrl);
 } catch (e) {
 log("Error merging parts: " + e.message);
 startBtn.disabled = false;
 select.disabled = false;
 return;
 }
 }

 startEJS(gameUrl, rom.file);
 } catch (e) {
 log("Error: " + e.message);
 startBtn.disabled = false;
 select.disabled = false;
 }
 });

 loadRoms();
 }
 </script>
 </body>
</html>
